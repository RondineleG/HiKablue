[package]
name = "vpn-engine"
version = "0.1.0"
edition = "2021"
description = "Experimental TUN <-> UDP forwarding engine for the HiKablue lab"

[dependencies]
clap = { version = "4", features = ["derive"] }
libc = "0.2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time"] }
