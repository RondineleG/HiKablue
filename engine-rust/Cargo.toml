[package]
name = "vpn-engine"
version = "0.1.0"
edition = "2021"
description = "Experimental TUN <-> UDP forwarding engine for the HiKablue lab"

[dependencies]
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
serde_json = "1"
zeroize = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync"] }
blake2 = "0.10"
