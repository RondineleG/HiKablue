[package]
name = "vpn-engine"
version = "0.1.0"
edition = "2021"
description = "Experimental TUN <-> UDP forwarding engine for the HiKablue lab"

[dependencies]
anyhow = "1"
base64 = "0.22"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "io-util", "sync", "process"] }
blake2 = "0.10"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
