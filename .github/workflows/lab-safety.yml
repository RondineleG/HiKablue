name: Lab safety

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diff-safety:
    name: no forbidden network/secret changes outside lab-owned files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the PR diff for forbidden patterns
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash tests/lab/check-diff-safety.sh "$BASE_SHA" "$HEAD_SHA"
