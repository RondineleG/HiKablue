name: Shell lint

on:
  pull_request:
    # Intentional: only PRs targeting main. Stacked PRs (base != main) are
    # validated locally with tests/checks.sh until they are retargeted.
    branches: [main]
    paths:
      - '**/*.sh'
      - '.github/workflows/shell-lint.yml'
  push:
    branches: [main]
    paths:
      - '**/*.sh'

permissions:
  contents: read

jobs:
  shellcheck:
    name: sh -n + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check every tracked shell script
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          for f in "${scripts[@]}"; do
            case "$(head -1 "$f")" in
              *bash*) bash -n "$f" ;;
              *) sh -n "$f" ;;
            esac
          done

      # shellcheck is preinstalled on ubuntu-latest.
      - name: shellcheck (warnings and above)
        run: |
          mapfile -t scripts < <(git ls-files '*.sh')
          shellcheck -S warning "${scripts[@]}"
