name: Rust CI

on:
  pull_request:
    # Intentional: only PRs targeting main. Stacked PRs (base != main) are
    # validated locally with tests/checks.sh until they are retargeted.
    branches: [main]
    paths:
      - 'engine-rust/**'
      - 'rust-toolchain.toml'
      - '.github/workflows/rust-ci.yml'
  push:
    branches: [main]
    paths:
      - 'engine-rust/**'
      - 'rust-toolchain.toml'

permissions:
  contents: read

jobs:
  rust:
    name: fmt, clippy, test, release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine-rust
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain (pinned by rust-toolchain.toml)
        # `rustup show` installs the channel + components declared in
        # rust-toolchain.toml; GitHub runners ship rustup preinstalled.
        run: rustup show

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: engine-rust

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy (warnings as errors)
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      - name: cargo build --release
        run: cargo build --release
